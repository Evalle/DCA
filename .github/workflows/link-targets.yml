name: Check link targets

# Finds links that still return 200 but have moved, now land on a landing page
# (page removed), or point to a #section that no longer exists. These pass
# "Check Markdown links", which only looks at the final HTTP status.

on:
  schedule:
    # Mondays at 09:30 UTC, after the weekly link check
    - cron: "30 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
    - .github/scripts/check_link_targets.py
    - .github/workflows/link-targets.yml

jobs:
  check-link-targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Check link targets
      run: |
        status=0
        python3 .github/scripts/check_link_targets.py > report.md || status=$?
        cat report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    # Scheduled and manual runs only: open an issue, or comment on the open one.
    - name: Report in an issue
      if: failure() && github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="Weekly check found moved or removed link targets"
        { echo "Run: $RUN_URL"; echo; cat report.md; } > issue-body.md
        existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body-file issue-body.md
        else
          gh issue create --title "$title" --body-file issue-body.md
        fi
